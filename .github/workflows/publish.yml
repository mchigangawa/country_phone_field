# Publishes to pub.dev when a version tag (v1.2.3) is pushed, using pub.dev's
# official OIDC automated-publishing reusable workflow (no secrets needed for
# the publish itself). Tags are created by the "Release" workflow.
#
# One-time setup on pub.dev: package -> Admin -> Automated publishing ->
# enable GitHub Actions, repository `mchigangawa/country_phone_field`,
# tag pattern `v{{version}}`.
name: Publish to pub.dev

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  publish:
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
