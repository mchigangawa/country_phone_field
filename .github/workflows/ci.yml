name: CI

on:
  push:
    # `main` pushes are gated by release.yml's own analyze/test steps, so we
    # only need standalone CI on `dev` pushes here.
    branches: [dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test
